desc: "SquadLens 是专为好友开黑小队打造的 AstrBot PUBG 插件：支持默认四人小队绑定与战绩查询、对局结束自动群聊播报、大模型自然语言复盘点评（LLM Tool），并提供可一键开关的内嵌 Web 战绩看板与移动优先 2D/3D 战术回放引擎（支持默认 4 色小队轨迹、点击追踪场上任意玩家路线、电竞级淘汰日志与离线归档导出）。"
